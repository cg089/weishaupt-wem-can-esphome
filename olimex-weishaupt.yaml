canbus:
  - platform: esp32_can
    id: my_can_bus
    can_id: 0x602
    tx_pin: GPIO5     # Olimex ESP32-EVB (Original WeAct CAN485: GPIO27)
    rx_pin: GPIO35    # Olimex ESP32-EVB (Original WeAct CAN485: GPIO26)
    bit_rate: 50kbps
    on_frame:
      # jeder Frame: Lebenszeichen des Busses + Antwort auf einen offenen Lesebefehl
      - can_id: 0x000
        can_id_mask: 0x000
        then:
          - lambda: |-
              id(wcan)->frame(millis());
              std::string t;
              bool fertig = id(wcan)->lesen.antwort(can_id, x, t, millis());
              id(wcan)->wem_netz.antwort(can_id, x, millis());   // WEM-Adresse per CAN (ab v42)
              if ((can_id & 0x780) == 0x700 && (can_id & 0x7F) != 0) id(wcan)->knoten_gesehen[can_id & 0x7F] = millis() | 1;
              // Teilstuecke/Block: naechste Leseanfrage (nach der Pause), Block-Ende quittieren
              uint32_t fid = 0; std::vector<uint8_t> fd;
              if (id(wcan)->lesen.weiter(fid, fd, millis())) id(wcan)->senden(fid, fd);
              // Schreibbefehl per CAN (ab v35, ab Werk aus): Antwort auswerten, naechstes Teilstueck
              std::string st;
              if (id(wcan)->schreiben.antwort(can_id, x, st, millis())) {
                id(wcan)->schalten.can_fertig = true; id(wcan)->schalten.can_text = st;
              }
              if (id(wcan)->schreiben.weiter(fid, fd, millis())) id(wcan)->senden(fid, fd);
              if (fertig) {
                id(lese_antwort).publish_state(t);
                id(lese_roh).publish_state(id(wcan)->lesen.roh);
                ESP_LOGI("lesen", "%s | roh: %s", t.c_str(), id(wcan)->lesen.roh.c_str());
              }

      # PDO 0x201: Aussentemperatur + Systembetriebsart (Kessel sendet von selbst)
      - can_id: 0x201
        then:
          - lambda: |-
              id(wem_aussentemp).publish_state(reg::pdo_wert(reg::AUSSENTEMP, x));
              int sb = x[reg::SYSTEMBETRIEBSART.byte];
              id(wem_systembetriebsart_code).publish_state((float) sb);
              id(wem_systembetriebsart).publish_state(wc::system_text(sb));

      # PDO 0x241: Heizanforderung (Bytes 0-1); Bytes 6-7 = Warmwasser (Paket warmwasser)
      - can_id: 0x241
        then:
          - lambda: |-
              id(wem_heizanforderung).publish_state(reg::pdo_wert(reg::VORLAUFSOLL_HZ, x));
              // Bytes 2-3: Kesseltemperatur (gleich 0x2532) - kommt so alle paar Sekunden, ohne Anfrage
              if (x.size() >= 4) id(wem_kessel).publish_state(reg::pdo_wert(reg::KESSEL_TEMP_PDO, x));

      # PDO 0x181: Datum und Uhrzeit der Heizung (Stunde, Minute, Jahr-2000, Monat, Tag, Wochentag)
      - can_id: 0x181
        then:
          - lambda: |-
              if (x.size() < 6) return;
              id(heizung_uhr).publish_state(wc::uhr_text(x));

      # SDO-Download an Knoten 0x42 (0x6C2): der Kessel meldet alle ~5 s Werte weiter.
      # Rein passiv mitgelesen. Objekte laut geronet1/wem-python, Werte an der Anlage plausibel.
      - can_id: 0x6C2
        then:
          - lambda: |-
              if (x.size() < 6 || (x[0] != 0x2B && x[0] != 0x2F && x[0] != 0x23)) return;
              uint16_t idx = (x[2] << 8) | x[1];
              uint8_t sub = x[3];
              int16_t v = (int16_t)((x[5] << 8) | x[4]);
              if (sub != 1) return;
              if (reg::ist(reg::RUECKLAUF_VPT, idx, sub)) id(wem_ruecklauf).publish_state(reg::wert(reg::RUECKLAUF_VPT, v));
              else if (reg::ist(reg::VORLAUF_VPT, idx, sub)) id(wem_vorlauf_vpt).publish_state(reg::wert(reg::VORLAUF_VPT, v));
              else if (reg::ist(reg::SOLLLEISTUNG, idx, sub)) id(wem_sollleistung).publish_state(reg::wert(reg::SOLLLEISTUNG, v));

      # PDO 0x182: Kesselstatus (Objekt 0x2530)
      - can_id: 0x182
        then:
          - lambda: |-
              uint8_t st = x[reg::KESSELSTATUS.byte];
              id(wem_kesselstatus).publish_state(bf::kessel_text(st));
              bf::status().setze(bf::status().kesselstatus, (int) st);
              id(wem_kesselstatus_code).publish_state((float) st);

      # PDO 0x1C1: Statusbits Knoten 1 (Objekt 0x274D) - 0x1000 Heizkreis Standby, 0x0010 WW-Ladung
      - can_id: 0x1C1
        then:
          - lambda: |-
              uint16_t m = (x[reg::STATUSBITS_PDO.byte + 1] << 8) | x[reg::STATUSBITS_PDO.byte];
              id(wcan)->anlass.statusbits(m, millis());
              id(wem_betriebsart_hk).publish_state(wc::hk_status_text(m));
              id(wem_betriebsart_hk_code).publish_state((float) m);

      # SDO-Antworten Knoten 1 (Systemgeraet)
      - can_id: 0x581
        then:
          - lambda: |-
              if ((x[0] & 0xF0) != 0x40) return;
              uint16_t idx = (x[2] << 8) | x[1];
              uint8_t sub = x[3];
              if (reg::ist(reg::STATUSBITS, idx, sub)) {
                uint16_t m = (x[5] << 8) | x[4];
                id(wem_betriebsart_hk_code).publish_state((float) m);
                id(wem_betriebsart_hk).publish_state(wc::hk_status_text(m));
                bf::status().setze(bf::status().hk_bits, (int) m);
              } else if (reg::ist(reg::VL_SOLL_ANF, idx, sub)) {
                id(wem_ww_vlsoll).publish_state(reg::wert(reg::VL_SOLL_ANF, (int16_t)((x[5] << 8) | x[4])));
              } else if (reg::ist(reg::HK_BETRIEBSART, idx, sub)) {
                // Heizkreis-Betriebsart (JSON MI02 0x2533/02)
                uint8_t b = x[4];
                id(hk_betriebsart_code).publish_state((float) b);
                id(hk_betriebsart).publish_state(wc::hk_name(b, "unbekannt"));
                bf::status().hk_gelesen(b, id(wcan)->unix_zeit());
                id(status_gelesen).publish_state(id(wcan)->zeit("%d.%m. %H:%M:%S ") + "gelesen");
              } else if (reg::ist(reg::RAUMSOLL, idx, sub) || reg::ist(reg::HK_VORLAUF, idx, sub)) {
                int16_t v = (int16_t)((x[5] << 8) | x[4]);
                if (v == (int16_t) 0x8000) return;
                if (reg::ist(reg::RAUMSOLL, idx, sub)) id(hk_raumsoll_akt).publish_state(reg::wert(reg::RAUMSOLL, v));
                else id(hk_vorlauf).publish_state(reg::wert(reg::HK_VORLAUF, v));
              }

      # SDO-Antworten Knoten 2 (Kessel)
      - can_id: 0x582
        then:
          - lambda: |-
              if ((x[0] & 0xF0) != 0x40) return;
              uint16_t idx = (x[2] << 8) | x[1];
              uint8_t sub = x[3];
              int32_t v = (int32_t)((uint32_t)x[7] << 24 | (uint32_t)x[6] << 16 | (uint32_t)x[5] << 8 | (uint32_t)x[4]);
              if (reg::ist(reg::DRUCK, idx, sub)) id(wem_druck).publish_state(reg::wert(reg::DRUCK, v));
              else if (reg::ist(reg::LEISTUNG, idx, sub)) id(wem_leistung).publish_state(reg::wert(reg::LEISTUNG, v));
              else if (reg::ist(reg::DREHZAHL, idx, sub)) id(wem_drehzahl).publish_state(reg::wert(reg::DREHZAHL, v));
              else if (reg::ist(reg::VORLAUF, idx, sub)) id(wem_vorlauf).publish_state(reg::wert(reg::VORLAUF, v));
              else if (reg::ist(reg::ABGAS, idx, sub)) id(wem_abgas).publish_state(reg::wert(reg::ABGAS, v));
              else if (reg::ist(reg::KESSEL_TEMP, idx, sub)) id(wem_kessel).publish_state(reg::wert(reg::KESSEL_TEMP, v));
              else if (reg::ist(reg::VORLAUF_SOLL, idx, sub)) id(wem_vorlauf_soll).publish_state(reg::wert(reg::VORLAUF_SOLL, v));
              else if (reg::ist(reg::BRENNER, idx, sub)) {
                // Betriebsphase Brenner: "Ein" nur mit Flamme (2/3); Flanke 0 -> 1 zaehlt einen Start
                int ph = v & 0xFF, b = 0;
                bool start = id(wcan)->brenner.phase(ph, b);
                id(wem_brennerphase).publish_state((float) ph);
                id(wem_brenner).publish_state((float) b);
                id(wem_brenner_text).publish_state(wc::brenner_text(ph));
                if (start) id(wem_brennerstarts).publish_state((float) id(wcan)->brenner.starts);
              }
              else if (reg::ist(reg::VOLUMENSTROM, idx, sub)) id(wem_volumenstrom).publish_state(reg::wert(reg::VOLUMENSTROM, v));
              else if (reg::ist(reg::WM_HEIZUNG, idx, sub)) id(wem_wm_heizung).publish_state(reg::wert(reg::WM_HEIZUNG, v));
              else if (reg::ist(reg::WM_WW, idx, sub)) id(wem_wm_ww).publish_state(reg::wert(reg::WM_WW, v));
              else if (reg::ist(reg::WM_GESAMT, idx, sub)) id(wem_wm_gesamt).publish_state(reg::wert(reg::WM_GESAMT, v));
      # ===== on_frame aus Paket warmwasser =====
      # PDO 0x241, Bytes 6-7: Warmwassertemperatur
      - can_id: 0x241
        then:
          - lambda: 'id(wem_warmwasser).publish_state(reg::pdo_wert(reg::WARMWASSER, x));'
      # PDO 0x182: Kesselstatus 15 = Warmwasserbetrieb
      - can_id: 0x182
        then:
          - lambda: |-
              bool an = x[reg::KESSELSTATUS.byte] == 15;
              id(wem_ww_aktiv).publish_state(an ? "Ein" : "Aus");
              id(wem_ww_aktiv_num).publish_state(an ? 1.0f : 0.0f);
      - can_id: 0x581
        then:
          - lambda: |-
              if ((x[0] & 0xF0) != 0x40) return;
              uint16_t idx = (x[2] << 8) | x[1];
              uint8_t sub = x[3];
              if (reg::ist(reg::WW_BETRIEBSART, idx, sub)) {
                // Warmwasser-Betriebsart (JSON MI03 0x2520/02): 1 = Ein, 2 = Aus
                uint8_t b = x[4];
                id(ww_betriebsart_code).publish_state((float) b);
                id(ww_betriebsart).publish_state(wc::ww_name(b, "unbekannt"));
                bf::status().ww_gelesen(b, id(wcan)->unix_zeit());
              } else if (reg::ist(reg::WW_SOLL_AKT, idx, sub) || reg::ist(reg::WW_SOLL_NORMAL, idx, sub)) {
                int16_t v = (int16_t)((x[5] << 8) | x[4]);
                if (v == (int16_t) 0x8000) return;
                if (reg::ist(reg::WW_SOLL_AKT, idx, sub)) { float w = reg::wert(reg::WW_SOLL_AKT, v); id(ww_soll_akt).publish_state(w); bf::status().setze_f(bf::status().ww_soll_akt, w); }
                else { float w = reg::wert(reg::WW_SOLL_NORMAL, v); id(ww_soll_normal).publish_state(w); bf::status().setze_f(bf::status().ww_soll_normal, w); }
              }
      # ===== on_frame aus Paket wem-schalten =====
      - can_id: 0x581
        then:
          - lambda: |-
              if ((x[0] & 0xF0) != 0x40 || !reg::ist(reg::HK_BETRIEBSART, (x[2] << 8) | x[1], x[3])) return;
              uint8_t b = x[4];
              if (b >= 1 && b <= 8) id(hk_setzen).publish_state(wc::hk_name(b, "?"));
              if (id(wcan)->schalten.ziel != 1 || !id(wcan)->schalten.pruefen) return;
              auto &s = bf::schaltung();
              s.uhr = id(wcan)->unix_zeit();
              int soll = s.lauf.wert; std::string q = s.lauf.quelle;
              s.bus_wert(1, b);
              std::string zeit = id(wcan)->zeit("%H:%M:%S ");
              bool ok = b == soll;
              std::string ist = wc::hk_name(b, "?");
              id(schalt_status).publish_state(zeit + (ok ? "OK: Heizkreis steht auf " + ist : "NICHT uebernommen, Heizkreis steht auf " + ist));
              id(protokoll_eintrag)->execute("Heizkreis -> " + std::string(bf::hk_text(soll)) + " (" + q + "): " + (ok ? "ok" : "NICHT uebernommen, steht auf " + ist));
              id(wcan)->schalten.ziel = 0; id(wcan)->schalten.pruefen = false;
              id(befehl_melden)->execute();
      # ===== on_frame aus Paket warmwasser-schalten =====
      - can_id: 0x581
        then:
          - lambda: |-
              if ((x[0] & 0xF0) != 0x40 || !reg::ist(reg::WW_BETRIEBSART, (x[2] << 8) | x[1], x[3])) return;
              uint8_t b = x[4];
              if (b == 1 || b == 2) id(ww_setzen).publish_state(b == 1 ? "Ein" : "Aus");
              if (id(wcan)->schalten.ziel != 2 || !id(wcan)->schalten.pruefen) return;
              auto &s = bf::schaltung();
              s.uhr = id(wcan)->unix_zeit();
              int soll = s.lauf.wert; std::string q = s.lauf.quelle;
              s.bus_wert(2, b);
              std::string zeit = id(wcan)->zeit("%H:%M:%S ");
              bool ok = b == soll;
              std::string ist = wc::ww_name(b, "?");
              id(schalt_status).publish_state(zeit + (ok ? "OK: Warmwasser " + ist : "NICHT uebernommen, Warmwasser " + ist));
              id(protokoll_eintrag)->execute(std::string("Warmwasser -> ") + bf::ww_text(soll) + " (" + q + "): " + (ok ? "ok" : "NICHT uebernommen, steht auf " + ist));
              id(wcan)->schalten.ziel = 0; id(wcan)->schalten.pruefen = false; id(wcan)->anlass.anlass_ms = millis() | 1;
              bf::status().anlass("schaltbefehl", true, true);
              id(befehl_melden)->execute();
      # ===== on_frame aus Paket kraiz-per-can =====
      # SDO-Antworten von WEM (0x581) und Kessel (0x582): was zur Tabelle passt, wird veroeffentlicht
      - can_id: 0x581
        then:
          - lambda: 'kc::antwort(can_id, x);'
      - can_id: 0x582
        then:
          - lambda: 'kc::antwort(can_id, x);'
      # CANopen-Emergency (0x080 + Knoten): falls die Anlage Fehler so meldet
      - can_id: 0x081
        then:
          - lambda: |-
              std::string t = kc::hex(x);
