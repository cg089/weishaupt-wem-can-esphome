          id: befehl_eingang
          ziel: 2
          nutzlast: !lambda 'return x;'
          quelle: "Web/HA"
      - script.execute: befehl_pruefen

text:
  # ===== aus Paket kessel =====
  # Lesebefehl "KNOTEN INDEX SUB" hex, z.B. "01 2933 02". NUR LESEN (0x40; lange Objekte in Teilstuecken, sonst Block 0xA4).
