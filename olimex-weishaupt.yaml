              id(kc_emergency).publish_state("WEM " + t);
      - can_id: 0x082
        then:
          - lambda: |-
              std::string t = kc::hex(x);
              ESP_LOGW("kraiz", "Emergency Knoten 2: %s", t.c_str());
              id(kc_emergency).publish_state("Kessel " + t);
